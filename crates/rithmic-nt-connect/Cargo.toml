[package]
name = "rithmic-nt-connect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust Rithmic R|Protocol session facade for rithmic-nt-connect (Phase 2: MD + PnL + orders)"
readme = "../../README.md"
repository = "https://github.com/ozeron/rithmic-nt-connect"

[lib]
name = "rithmic_nt_connect"
crate-type = ["cdylib", "rlib"]

[features]
# Empty Cargo default so `cargo test -p rithmic-nt-connect` does not link libpython.
# Maturin builds enable `python` via pyproject.toml `[tool.maturin] features`.
default = []
python = ["dep:pyo3"]
# Enabled automatically by maturin when building the extension module.
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
rithmic-rs = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
pyo3 = { version = "0.23", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
