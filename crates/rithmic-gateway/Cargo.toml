[package]
name = "rithmic-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-agnostic length-delimited protobuf framing and broker for shared Rithmic sessions"
build = "build.rs"

[[bin]]
name = "rithmic-gateway"
path = "src/bin/rithmic_gateway.rs"

# Test-only: the real server over a scripted fake plant. Never built by default,
# never in the wheel (`python/pyproject.toml` `[tool.maturin] targets` lists the
# production bin only), and the production binary cannot select it.
[[bin]]
name = "rithmic-gateway-fake"
path = "src/bin/rithmic_gateway_fake.rs"
required-features = ["testing"]

[features]
testing = ["rithmic-plants/testing"]

[dependencies]
async-trait = "0.1"
rithmic-plants = { path = "../rithmic-plants" }
rithmic-rs = "3"
bytes = "1"
futures-util = "0.3"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread", "fs", "signal", "time"] }
fs2 = "0.4.3"
libc = "0.2"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
# Self dev-dependency: enables the `testing` feature for `cargo test`, which builds
# the test-only fake gateway binary the integration tests spawn.
rithmic-gateway = { path = ".", features = ["testing"] }
rithmic-plants = { path = "../rithmic-plants", features = ["testing"] }
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread", "time", "test-util"] }
tempfile = "3"
