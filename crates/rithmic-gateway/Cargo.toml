[package]
name = "rithmic-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-agnostic length-delimited protobuf framing and broker for shared Rithmic sessions"
build = "build.rs"

[[bin]]
name = "rithmic-gateway"
path = "src/bin/rithmic_gateway.rs"

[dependencies]
rithmic-plants = { path = "../rithmic-plants" }
rithmic-rs = "3"
bytes = "1"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread", "fs", "signal", "time"] }
fs2 = "0.4.3"
libc = "0.2"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread", "time"] }
tempfile = "3"
