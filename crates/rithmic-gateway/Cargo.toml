[package]
name = "rithmic-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Transport-agnostic length-delimited protobuf framing and broker for shared Rithmic sessions"
build = "build.rs"

[dependencies]
rithmic-plants = { path = "../rithmic-plants" }
bytes = "1"
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread"] }

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "rt-multi-thread"] }
