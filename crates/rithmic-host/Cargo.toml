[package]
name = "rithmic-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Venue-independent Rithmic session contract and test venue"

[features]
testing = []

[dependencies]
bytes = "1"
fs2 = "0.4.3"
libc = "0.2"
rithmic-exec = { path = "../rithmic-exec" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
thiserror = "2"

[dev-dependencies]
rithmic-host = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
