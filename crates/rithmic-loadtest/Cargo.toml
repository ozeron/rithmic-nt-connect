[package]
name = "rithmic-loadtest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synthetic load harness for the gateway and session layers (fake plant, no credentials). Not shipped in the wheel."
publish = false

[[bin]]
name = "rithmic-load"
path = "src/main.rs"

[dependencies]
rithmic-gateway = { path = "../rithmic-gateway", features = ["testing"] }
rithmic-plants = { path = "../rithmic-plants", features = ["testing"] }
tokio = { version = "1", features = ["full"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
prost = "0.14"
tempfile = "3"
