[package]
name = "rithmic-plants"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Rithmic plant session façade over rithmic-rs"

[features]
# Fake Rithmic websocket server for offline venue tests. Never enabled in the shipped wheel.
testing = ["dep:tokio-tungstenite", "dep:futures-util", "tokio/net"]

[dependencies]
rithmic-host = { path = "../rithmic-host" }
async-trait = "0.1"
rithmic-exec = { path = "../rithmic-exec" }
rithmic-rs = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
rithmic-host = { path = "../rithmic-host", features = ["testing"] }
# Venue tests use FakeRithmicServer; contract scenarios also use host/testing.
rithmic-plants = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
