[package]
name = "rithmic-plants"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Rithmic plant session façade over rithmic-rs"

[features]
# Scripted in-memory `Session` for gateway tests. Never enabled in the shipped wheel.
testing = []

[dependencies]
async-trait = "0.1"
rithmic-exec = { path = "../rithmic-exec" }
rithmic-rs = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
