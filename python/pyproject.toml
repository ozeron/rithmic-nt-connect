[project]
name = "rithmic-gateway"
version = "0.1.0"
description = "Pure-Python client for rithmic-gateway (unix protobuf RPC + auto-spawn). No Nautilus / maturin."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "protobuf>=5.29.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rithmic_gateway"]
