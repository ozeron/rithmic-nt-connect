[project]
name = "rithmic-connect"
version = "0.1.0"
description = "Unofficial Rithmic R|Protocol adapter compatible with NautilusTrader (Rust core, Python surface)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "rithmic-connect contributors" }]
dependencies = [
  # Pin during Phase 1 implementation planning
  # "nautilus_trader==1.231.*",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
# Placeholder — crate path and module name decided in implementation planning
manifest-path = "crates/rithmic-connect/Cargo.toml"
module-name = "rithmic_connect._lib"
python-source = "python"
