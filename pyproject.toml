[project]
name = "rithmic-nt-connect"
version = "0.1.0"
description = "Unofficial Rithmic R|Protocol adapter compatible with NautilusTrader (Rust core, Python surface)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "rithmic-nt-connect contributors" }]
dependencies = [
  "nautilus_trader==1.231.0",
  "protobuf==5.29.6",
]

[project.urls]
Homepage = "https://github.com/ozeron/rithmic-nt-connect"
Repository = "https://github.com/ozeron/rithmic-nt-connect"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
nautilus = [
  "nautilus_trader==1.231.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/rithmic-nt-connect/Cargo.toml"
module-name = "rithmic_nt_connect._lib"
python-source = "python"
features = ["python", "extension-module"]
data = "wheel-data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
    "live: real-connection e2e (tests/e2e); auto-skip without RITHMIC_TEST_DOTENV",
    "slow: takes >30s (1m EXTERNAL bar poll); deselect with -m 'not slow'",
]

[tool.pyright]
include = ["python"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Nautilus model classes (orders/events/data/...) are compiled Cython with no
# shipped stubs, so pyright sees them as Unknown. ``stubs/`` holds stubgen
# output generated from the installed nautilus_trader (runtime attribute
# surface) plus hand-ported ctor fixes; regenerate with:
#   uv run --with mypy python scripts/gen_nautilus_stubs.py
stubPath = "stubs"
# The package lazily re-exports factory/historical helpers via PEP 562
# ``__getattr__`` (avoids importing nautilus_trader at package import); pyright
# cannot see those names and flags them in ``__all__``.
reportUnsupportedDunderAll = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
