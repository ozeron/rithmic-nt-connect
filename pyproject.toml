[project]
name = "rithmic-nt-connect"
version = "0.1.0"
description = "Unofficial Rithmic R|Protocol adapter compatible with NautilusTrader (Rust core, Python surface)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "rithmic-nt-connect contributors" }]
dependencies = [
  "nautilus_trader==1.231.0",
  "protobuf==5.29.6",
]

[project.urls]
Homepage = "https://github.com/ozeron/rithmic-nt-connect"
Repository = "https://github.com/ozeron/rithmic-nt-connect"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
nautilus = [
  "nautilus_trader==1.231.0",
]
# The gateway parent binary + pure-Python lake client ship as their own platform
# wheel (`python/`); the adapter never imports it, so it is opt-in.
gateway = [
  "rithmic-gateway",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/rithmic-nt-connect/Cargo.toml"
module-name = "rithmic_nt_connect._lib"
python-source = "python"
features = ["python", "extension-module"]

[tool.uv.sources]
# In-repo source for `--extra gateway`; consumers resolve it from the wheel index.
rithmic-gateway = { path = "python" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "scripts"]
markers = [
    "live: real-connection e2e (tests/e2e); auto-skip without RITHMIC_TEST_DOTENV",
    "slow: takes >30s (1m EXTERNAL bar poll); deselect with -m 'not slow'",
    "perf: synthetic throughput measurements (tests/test_perf_ffi_throughput.py); need RITHMIC_PERF=1",
]

[tool.ty.environment]
# Nautilus model classes (orders/events/data/...) are compiled Cython with no
# shipped stubs, so ty sees them as Unknown. ``stubs/`` holds stubgen output
# generated from the installed nautilus_trader (runtime attribute surface) plus
# hand-ported ctor fixes; regenerate with:
#   uv run --with mypy python scripts/gen_nautilus_stubs.py
extra-paths = ["stubs", "tests", "scripts"]

[tool.ty.analysis]
# session_pb2 is protoc-generated: its message classes are created dynamically
# (``BuildMessageAndEnumDescriptors``), so no checker can see them.
replace-imports-with-any = ["rithmic_gateway.v1.**"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  "stubs",
  "python/rithmic_gateway/v1/session_pb2.py",
]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle — syntax/style errors
  "F",      # pyflakes — real bugs (unused imports, undefined names)
  "I",      # isort — import ordering
  "UP",     # pyupgrade — modern Python syntax
  "B",      # flake8-bugbear — common bug patterns
  "SIM",    # flake8-simplify — simplifiable code
  "RUF",    # ruff-specific rules
  "FURB",   # refurb — modernizations / cleanups
]

[dependency-groups]
dev = [
    "grpcio-tools==1.71.0",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
