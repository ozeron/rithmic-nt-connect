[project]
name = "rithmic-connect"
version = "0.1.0"
description = "Unofficial Rithmic R|Protocol adapter compatible with NautilusTrader (Rust core, Python surface)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "rithmic-connect contributors" }]
dependencies = [
  "nautilus_trader==1.231.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
nautilus = [
  "nautilus_trader==1.231.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/rithmic-connect/Cargo.toml"
module-name = "rithmic_connect._lib"
python-source = "python"
features = ["python", "extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
