[project]
name = "rithmic-nt-connect"
version = "0.1.0"
description = "Unofficial Rithmic R|Protocol adapter compatible with NautilusTrader (Rust core, Python surface)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "rithmic-nt-connect contributors" }]
dependencies = [
  "nautilus_trader==1.231.0",
  "protobuf>=5.29.6",
]

[project.urls]
Homepage = "https://github.com/ozeron/rithmic-nt-connect"
Repository = "https://github.com/ozeron/rithmic-nt-connect"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
nautilus = [
  "nautilus_trader==1.231.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/rithmic-nt-connect/Cargo.toml"
module-name = "rithmic_nt_connect._lib"
python-source = "python"
features = ["python", "extension-module"]
data = "wheel-data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
    "live: needs LucidTrading credentials + network (auto-skip without RITHMIC_USER/PW)",
    "slow: takes >30s (1m EXTERNAL bar poll); deselect with -m 'not slow'",
]
