name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Unit tests for convert/config/data do not require the native wheel
      - name: Cargo test
        run: cargo test -p rithmic-connect
      - name: Pytest (no secrets)
        env:
          PYTHONPATH: python
        run: pytest -q
