# Customized from `qlty init` output. The default scaffolding picked the right
# plugin set for our languages; this file tightens exclude paths, raises a few
# smell thresholds (cymatic noise in the gateway dispatch /pb convert path),
# and gates the smells mode to `block` (matches `ruff check` / `cargo clippy
# -D warnings` strictness for newly introduced code).
#
# CI runs `qlty check` (no `--all`), so pre-existing smells are grandfathered
# and only NEW findings fail a PR. Locally you can run `qlty check --all` to
# see the full baseline; the scoreboard lives at `nautilus-adapter-conventions`
# docs and `docs/STATUS.md`.
config_version = "0"

exclude_patterns = [
  # qlty-init defaults (build / vendored / generated).
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  # Project-specific.
  "artifacts/**",                # local verify / smoke scratch dirs
  ".cache/**",                   # e2e fixture cache
  ".venv/**",                    # uv virtualenv
  ".pytest_cache/**",
  ".mypy_cache/**",
  ".ruff_cache/**",
  "wheel-data/**",               # maturin build artifacts
  "stubs/**",                    # stubgen output for `ty`
  "proto/**",                    # gated Rithmic .proto sources (see .gitignore)
  "tests/_stubs.py",             # local python stubs shared with the test suite
  "python/rithmic_gateway/v1/**", # protoc-generated descriptor / stub module
]

# qlty uses these to skip smells analysis on test code; the patterns below
# cover our pytest tests and Rust unit / integration tests.
test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

# Block mode (per project preference). CI runs `qlty check` (default = changed
# files) so the gate only fires on newly introduced smells; pre-existing
# findings surface in `qlty check --all` / `qlty smells --all` but do not fail
# the PR. Thresholds below are loosened slightly vs the qltysh defaults to
# avoid blocking legitimate protocol-conversion glue (e.g. one Rust fn in
# `crates/rithmic-gateway/src/bin/rithmic_gateway.rs` is intrinsically stateful).
[smells]
mode = "block"

[smells.file_complexity]
threshold = 75

[smells.function_complexity]
threshold = 20

[smells.identical_code]
threshold = 25

[smells.similar_code]
threshold = 25

[[source]]
name = "default"
default = true

# Plugins mirror `qlty init`. `ruff` runs lint-only because format stays in hk's
# `ruff-format` step (single owner for `--fix`); `clippy` keeps its own
# `-D warnings` gate in hk.pkl so warning-level new findings still fail.
# rustfmt is intentionally NOT enabled here — the qltysh rustfmt driver does
# not pick up Cargo workspace `edition = "2021"` and would re-parse every Rust
# file as 2015, generating false positives. hk's `cargo-fmt` step is the
# single source of truth for Rust formatting. `zizmor` and `actionlint`
# complement each other on `.github/workflows/*.yml`.
[[plugin]]
name = "actionlint"

[[plugin]]
name = "bandit"

[[plugin]]
name = "clippy"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-python"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = ["lint"]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# Triage: silence findings that are unavoidable in this repo's protocol/proto
# layout. New findings still appear at full level — these only relax the *mode*
# (i.e. never fail the gate).
[[triage]]
# dtolnay/rust-toolchain@stable is an intentional branch ref (auto-updates to
# the current Rust stable release). SHA-pinning would freeze the compiler;
# branch pinning is the upstream-recommended pattern. SHA-pinned first-party
# and qlty-action steps survive unscathed. Silenced at the gate; the rule
# remains useful for the PR diff if a new SHA-unpinned action appears on a
# different step.
match.plugins = ["zizmor"]
match.rules = ["zizmor:zizmor/unpinned-uses"]
set.ignored = true

[[triage]]
# bandit flagging pytest asserts (B101). Pytest's whole assertion model uses
# `assert` as the idiomatic API; `# noqa` per line would dwarf the actual
# test code. Non-`tests/` bandit B101 findings still fire.
match.plugins = ["bandit"]
match.rules = ["bandit:B101"]
match.file_patterns = ["tests/**", "scripts/**"]
set.ignored = true

[[triage]]
# bandit's password-string rules fire on Rithmic's documented example values
# in `.env.example` (public, definitionally safe) and on test fixtures that
# reuse them. Real `.env` is gitignored and never scanned.
match.plugins = ["bandit"]
match.rules = ["bandit:B105", "bandit:B106", "bandit:B107"]
match.file_patterns = [".env.example", "tests/**", "scripts/**"]
set.ignored = true

[[triage]]
# bandit B108 (insecure tmp file) flags `tempfile.NamedTemporaryFile` and
# similar. Our tests use `tempfile` crate (Rust) and Python `tempfile` with
# secure defaults; bandit's regex does not distinguish safe usage.
match.plugins = ["bandit"]
match.rules = ["bandit:B108"]
match.file_patterns = ["tests/**", "scripts/**"]
set.ignored = true

[[triage]]
# bandit B603 (subprocess untrusted input) + B404 (subprocess import) + B607
# (partial executable path) flag every `subprocess.run` regardless of how
# shell-safe it is. Our scripts/ invoke a fixed arglist (no shell, no
# interpolation); our tests/ invoke `sys.executable` against the in-repo
# `scripts/gateway_tick_consumer.py` for the contract test. Both are safe by
# construction — silence the noise so the only remaining B603/B404/B607 hit
# is a *new* call that adds a real path-injection risk.
match.plugins = ["bandit"]
match.rules = ["bandit:B603", "bandit:B404", "bandit:B607"]
match.file_patterns = ["tests/**", "scripts/**"]
set.ignored = true

[[triage]]
# bandit B110 (try / except / pass) and B112 (try / except / continue) over
# the gateway dispatch / socket-edge recovery paths. Our recovery code
# intentionally swallows narrow (TimeoutError, ConnectionError, OSError) to
# keep the socket reconnect loop running on transient races; bandit's regex
# doesn't follow the except tuple. Remaining B110/B112 in production code
# still fire (those are real bugs we want humans to look at).
match.plugins = ["bandit"]
match.rules = ["bandit:B110", "bandit:B112"]
match.file_patterns = ["python/**"]
set.ignored = true

[[triage]]
# bandit B105/B106 flag the `"***"` redact placeholder in
# ``python/rithmic_nt_connect/config.py`` and the literal password strings
# in test fixtures used to assert redaction (defining a literal here is the
# whole point of the test). Production credential paths read from env vars
# / dotenv files and are never inline.
match.plugins = ["bandit"]
match.rules = ["bandit:B105", "bandit:B106", "bandit:B107"]
match.file_patterns = ["python/**"]
set.ignored = true

[[triage]]
# radarlint-python's empty-block + cognitive-complexity rules are stricter
# than qltysh's built-in smells and double-report. The native smells block
# is the gateway for complexity decisions; radarlint is silenced for the
# redundancy.
match.plugins = ["radarlint-python"]
match.rules = ["radarlint-python:python:S108", "radarlint-python:python:S3776"]
match.file_patterns = ["python/**", "tests/**", "scripts/**"]
set.ignored = true
